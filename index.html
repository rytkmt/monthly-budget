<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="外食予算">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>外食予算</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <button type="button" id="prev-month" class="icon-btn" aria-label="前の月">‹</button>
      <div class="month-title">
        <span id="month-label"></span>
        <button type="button" id="this-month" class="link" hidden>今月へ</button>
      </div>
      <button type="button" id="next-month" class="icon-btn" aria-label="次の月">›</button>
      <button type="button" id="menu-btn" class="icon-btn" aria-label="メニュー" aria-expanded="false" aria-controls="menu">☰</button>
    </header>

    <div id="menu-backdrop" class="backdrop" hidden></div>
    <div id="menu" class="menu" hidden>
      <form id="budget-form" class="frow-group">
        <p class="menu-title"><span id="budget-month-label"></span>の予算</p>
        <div class="frow">
          <label for="budget-input">予算</label>
          <input id="budget-input" type="number" inputmode="numeric" min="0" max="9999999" step="1" required>
          <span class="unit">円</span>
          <button type="submit">保存</button>
        </div>
        <p id="budget-note" class="note"></p>
        <p id="budget-error" class="error" role="alert"></p>
      </form>

      <div class="frow-group">
        <p class="menu-title">バックアップ</p>
        <p id="last-backup" class="note"></p>
        <div class="btn-row">
          <button type="button" id="export-btn">書き出す</button>
          <label class="btn secondary" for="import-file">読み込む</label>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
        <p class="note">書き出すと共有メニューが開きます。「ファイルに保存」を選んでください。</p>
        <p id="backup-msg" class="note msg"></p>
      </div>

      <form id="delete-form" class="frow-group">
        <p class="menu-title">過去データの削除</p>
        <div class="frow">
          <label for="del-month">〜まで</label>
          <input id="del-month" type="month" required>
          <button type="submit" class="danger">削除</button>
        </div>
        <p id="delete-msg" class="note"></p>
      </form>

      <p class="note">ホーム画面に追加して使ってください。Safari のタブのままだと、7日間開かないとデータが消えることがあります。</p>
    </div>

    <section id="balance" class="balance" data-level="none" aria-live="polite">
      <p class="balance-main"><span class="balance-caption">残金</span><span id="balance-amount" class="balance-amount">—</span></p>
      <p id="balance-detail" class="balance-detail"></p>
    </section>

    <section class="calendar" aria-label="カレンダー">
      <div id="calendar"></div>
      <p id="calendar-hint" class="note">日付をタップすると、その日の支出を確認・追加できます。</p>
    </section>

    <section id="day-panel" class="day-panel" hidden>
      <h2 id="day-title"></h2>
      <ul id="expense-list" class="expense-list"></ul>
      <form id="expense-form">
        <p id="form-title" class="form-title" hidden>支出を編集</p>
        <div id="exp-date-row" class="frow" hidden>
          <label for="exp-date">日付</label>
          <input id="exp-date" type="date" required>
        </div>
        <div class="frow">
          <label for="exp-amount">金額</label>
          <input id="exp-amount" type="number" inputmode="numeric" min="1" max="9999999" step="1" required>
          <span class="unit">円</span>
        </div>
        <div class="frow">
          <label for="exp-memo">内容</label>
          <input id="exp-memo" type="text" maxlength="20" autocomplete="off" placeholder="20字まで">
          <button type="submit" id="exp-submit">追加</button>
          <button type="button" id="exp-cancel" class="secondary" hidden>戻る</button>
        </div>
        <p id="exp-error" class="error" role="alert"></p>
      </form>
    </section>

    <p id="fatal" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
