<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>外食予算</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <nav class="month-nav" aria-label="月の移動">
      <button type="button" id="prev-month" aria-label="前の月">‹</button>
      <div class="month-title">
        <span id="month-label"></span>
        <button type="button" id="this-month" class="link" hidden>今月へ</button>
      </div>
      <button type="button" id="next-month" aria-label="次の月">›</button>
    </nav>

    <section id="balance" class="balance" data-level="none" aria-live="polite">
      <p class="balance-caption">残金</p>
      <p id="balance-amount" class="balance-amount">—</p>
      <p id="balance-detail" class="balance-detail"></p>
    </section>

    <section class="budget">
      <p id="budget-note" class="note"></p>
      <button type="button" id="budget-edit" class="secondary">予算を設定</button>
      <form id="budget-form" hidden>
        <label for="budget-input">この月の予算（円）</label>
        <div class="row">
          <input id="budget-input" type="number" inputmode="numeric" min="0" max="9999999" step="1" required>
          <button type="submit">保存</button>
          <button type="button" id="budget-cancel" class="secondary">キャンセル</button>
        </div>
        <p id="budget-error" class="error" role="alert"></p>
      </form>
    </section>

    <p id="fatal" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
