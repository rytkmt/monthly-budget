<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>外食予算</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <nav class="month-nav" aria-label="月の移動">
      <button type="button" id="prev-month" aria-label="前の月">‹</button>
      <div class="month-title">
        <span id="month-label"></span>
        <button type="button" id="this-month" class="link" hidden>今月へ</button>
      </div>
      <button type="button" id="next-month" aria-label="次の月">›</button>
    </nav>

    <section id="balance" class="balance" data-level="none" aria-live="polite">
      <p class="balance-caption">残金</p>
      <p id="balance-amount" class="balance-amount">—</p>
      <p id="balance-detail" class="balance-detail"></p>
    </section>

    <section class="budget">
      <p id="budget-note" class="note"></p>
      <button type="button" id="budget-edit" class="secondary">予算を設定</button>
      <form id="budget-form" hidden>
        <label for="budget-input">この月の予算（円）</label>
        <div class="row">
          <input id="budget-input" type="number" inputmode="numeric" min="0" max="9999999" step="1" required>
          <button type="submit">保存</button>
          <button type="button" id="budget-cancel" class="secondary">キャンセル</button>
        </div>
        <p id="budget-error" class="error" role="alert"></p>
      </form>
    </section>

    <section class="calendar" aria-label="カレンダー">
      <div id="calendar"></div>
      <p id="calendar-hint" class="note">日付をタップすると、その日の支出を確認・追加できます。</p>
    </section>

    <section id="day-panel" class="day-panel" hidden>
      <h2 id="day-title"></h2>
      <ul id="expense-list" class="expense-list"></ul>
      <form id="expense-form">
        <h3 id="form-title">支出を追加</h3>
        <label for="exp-date">日付</label>
        <input id="exp-date" type="date" required>
        <label for="exp-amount">金額（円）</label>
        <input id="exp-amount" type="number" inputmode="numeric" min="1" max="9999999" step="1" required>
        <label for="exp-memo">内容（20字まで）</label>
        <input id="exp-memo" type="text" maxlength="20" autocomplete="off">
        <div class="row actions">
          <button type="submit" id="exp-submit">追加</button>
          <button type="button" id="exp-cancel" class="secondary" hidden>キャンセル</button>
        </div>
        <p id="exp-error" class="error" role="alert"></p>
      </form>
    </section>

    <p id="fatal" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
